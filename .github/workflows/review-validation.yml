name: Review validation
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
permissions:
  contents: read
jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue and price import contracts
        run: |
          python scripts/validate_catalog.py
          python scripts/test_titles.py
          python scripts/validate_ratings.py
          python -m unittest discover -s scripts -p 'test_import_winestyle.py'
          python -m unittest discover -s scripts -p 'test_verified_offers.py' -v
          python -m unittest discover -s scripts -p 'test_import_manual_capture.py' -v
          node --check extension/capture.js
          node --check extension/popup.js
          node --check app.js
          node scripts/test_theme.mjs
