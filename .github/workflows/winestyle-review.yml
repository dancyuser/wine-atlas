name: WineStyle parser review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-enrichment.txt
      - name: Install HTML parser
        run: python -m pip install -r scripts/requirements-enrichment.txt
      - name: Run catalog checks and synthetic WineStyle tests
        run: |
          python scripts/validate_catalog.py
          python scripts/test_titles.py
          python scripts/validate_ratings.py
          python scripts/validate_enrichment.py
          python -m unittest discover -s scripts -p 'test_enrichment_import.py' -v
          python -m unittest discover -s scripts -p 'test_catalog_rebuild.py' -v
          python -m unittest discover -s scripts -p 'test_winestyle_parser.py' -v
          node --check app.js
          node scripts/test_theme.mjs
          node scripts/test_enrichment_ui.cjs
