name: Deploy static wine catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site data and JavaScript
        run: |
          python scripts/validate_catalog.py
          python scripts/test_publication_review.py
          python scripts/test_titles.py
          python scripts/validate_ratings.py
          python scripts/test_vivino_reconciliation.py
          python scripts/validate_enrichment.py
          python scripts/validate_verified_snapshot.py
          python scripts/validate_researched_photos.py
          python scripts/report_catalog_gaps.py > /dev/null
          python -m unittest discover -s scripts -p 'test_recover_capture_ratings.py' -v
          python -m unittest discover -s scripts -p 'test_recover_capture_prices.py' -v
          python -m unittest discover -s scripts -p 'test_enrichment_import.py' -v
          python -m unittest discover -s scripts -p 'test_catalog_rebuild.py' -v
          python -m unittest discover -s scripts -p 'test_verified_offers.py' -v
          python -m unittest discover -s scripts -p 'test_import_manual_capture.py' -v
          python -m unittest discover -s scripts -p 'test_site_package.py' -v
          python -m unittest discover -s scripts -p 'test_smoke_pages.py' -v
          node --check extension/capture.js
          node --check extension/popup.js
          node scripts/test_extension_capture.cjs
          node scripts/test_visible_price_capture.cjs
          node --check extension/batch_core.js
          node --check extension/background.js
          node scripts/test_batch_core.cjs
          node scripts/test_batch_background.cjs
          python -m unittest discover -s scripts -p 'test_wine_classifier.py' -v
          node scripts/test_discoveries.cjs
          node --check app.js
          node scripts/test_theme.mjs
          node scripts/test_enrichment_ui.cjs
          node scripts/test_catalog_filters.cjs
          node scripts/test_responsive_ui.mjs
      - name: Assemble minimal Pages artifact
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact indexing
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify actual GitHub Pages content after deploy
        run: python scripts/smoke_pages.py "${{ steps.deployment.outputs.page_url }}"
